<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habla — Spain Spanish Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --ink: #1a1410;
    --red: #c0392b;
    --gold: #b8963e;
    --cream: #ede8da;
    --light: #e8e2d4;
    --muted: #8a7f6e;
    --border: #c8bfaa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 0;
    position: relative;
    overflow-x: hidden;
  }

  /* Decorative background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 15% 20%, rgba(192,57,43,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(184,150,62,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 32px 80px;
  }

  header {
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 28px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }

  .logo span {
    color: var(--red);
  }

  .tagline {
    margin-top: 8px;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  /* Input area */
  .input-section {
    margin-bottom: 36px;
  }

  .input-label {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 10px;
    display: block;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  textarea {
    flex: 1;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    resize: none;
    height: 56px;
    line-height: 1.5;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  textarea::placeholder { color: var(--muted); }

  textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
    height: 80px;
  }

  .submit-btn {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0 20px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
    min-width: 80px;
  }

  .submit-btn:hover { background: #a93226; }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 20px;
  }

  .loading.visible { display: flex; }

  .dots span {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* Result card */
  .result-card {
    display: none;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    animation: slideUp 0.35s ease;
  }

  .result-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    background: var(--ink);
    padding: 18px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .spanish-phrase {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-style: italic;
    color: white;
    line-height: 1.3;
    flex: 1;
  }

  .speak-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    color: white;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .speak-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.6);
  }

  .speak-icon { font-size: 0.95rem; }

  /* Notes strip */
  .notes-strip {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    font-size: 0.78rem;
    color: var(--muted);
    font-style: italic;
  }

  /* Vocabulary table */
  .vocab-section {
    padding: 20px 24px 24px;
  }

  .vocab-label {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .vocab-table {
    width: 100%;
    border-collapse: collapse;
  }

  .vocab-table tr {
    border-bottom: 1px solid var(--light);
    transition: background 0.15s;
  }

  .vocab-table tr:last-child { border-bottom: none; }
  .vocab-table tr:hover { background: var(--cream); }

  .vocab-table td {
    padding: 9px 4px;
    font-size: 0.88rem;
    vertical-align: top;
  }

  .td-spanish {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    color: var(--ink);
    width: 30%;
    padding-right: 12px;
  }

  .td-type {
    width: 20%;
    padding-right: 12px;
  }

  .type-badge {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 500;
    display: inline-block;
    white-space: nowrap;
  }

  .badge-verb { background: rgba(192,57,43,0.1); color: var(--red); }
  .badge-noun { background: rgba(184,150,62,0.12); color: #8a6a1a; }
  .badge-adj  { background: rgba(44,110,164,0.1);  color: #2c6ea4; }
  .badge-adv  { background: rgba(39,174,96,0.1);   color: #1e8449; }
  .badge-prep { background: rgba(142,68,173,0.1);  color: #7d3c98; }
  .badge-other{ background: rgba(0,0,0,0.06);       color: var(--muted); }

  .td-english {
    color: var(--ink);
    width: 50%;
  }

  .infinitive-note {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
    font-style: italic;
  }

  /* API Key section */
  .apikey-section {
    margin-bottom: 40px;
    padding: 16px 20px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .apikey-section.saved {
    background: rgba(39,174,96,0.06);
    border-color: rgba(39,174,96,0.3);
  }

  .apikey-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .apikey-input {
    flex: 1;
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .apikey-input:focus { border-color: var(--red); }

  .apikey-btn {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 9px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .apikey-btn:hover { background: #333; }

  .apikey-status {
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .apikey-status.ok { color: #1e8449; }

  /* Error */
  .error-msg {
    display: none;
    background: rgba(192,57,43,0.08);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 0.875rem;
    color: var(--red);
    margin-top: 16px;
  }

  .error-msg.visible { display: block; }

  /* Footer */
  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo">Habl<span>a</span></div>
    <div class="tagline">Spain Spanish · Phrase Helper</div>
  </header>

  <div class="apikey-section" id="apikey-section">
    <label class="input-label" for="apikey-input">Anthropic API Key</label>
    <div class="apikey-row">
      <input
        type="password"
        id="apikey-input"
        class="apikey-input"
        placeholder="sk-ant-..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="apikey-btn" onclick="saveKey()">Save</button>
      <button class="apikey-btn" style="background:var(--muted)" onclick="clearKey()">Clear</button>
    </div>
    <div class="apikey-status" id="apikey-status">Stored in your browser only — never sent anywhere except the Anthropic API.</div>
  </div>

  <div class="input-section">
    <label class="input-label" for="phrase-input">What did you want to say?</label>
    <div class="input-row">
      <textarea
        id="phrase-input"
        placeholder="e.g. I am going to shower"
        rows="1"
      ></textarea>
      <button class="submit-btn" id="submit-btn" onclick="translate()">Go</button>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="dots"><span></span><span></span><span></span></div>
    <span>Translating…</span>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="result-card" id="result-card">
    <div class="result-header">
      <div class="spanish-phrase" id="spanish-phrase"></div>
      <button class="speak-btn" id="speak-btn" onclick="speak()">
        <span class="speak-icon">▶</span> Escuchar
      </button>
    </div>
    <div class="notes-strip" id="notes-strip"></div>
    <div class="vocab-section">
      <div class="vocab-label">Vocabulary Breakdown</div>
      <table class="vocab-table" id="vocab-table"></table>
    </div>
  </div>

  <footer>Uses Claude · Spain Spanish (Castilian) · Speech via Web Speech API</footer>

</div>

<script>
  const input = document.getElementById('phrase-input');
  const submitBtn = document.getElementById('submit-btn');
  const loading = document.getElementById('loading');
  const resultCard = document.getElementById('result-card');
  const spanishPhrase = document.getElementById('spanish-phrase');
  const notesStrip = document.getElementById('notes-strip');
  const vocabTable = document.getElementById('vocab-table');
  const errorMsg = document.getElementById('error-msg');
  const apikeyInput = document.getElementById('apikey-input');
  const apikeyStatus = document.getElementById('apikey-status');
  const apikeySection = document.getElementById('apikey-section');

  let currentPhrase = '';

  // Load saved key on startup
  const savedKey = localStorage.getItem('habla_api_key');
  if (savedKey) {
    apikeyInput.value = savedKey;
    showKeySaved();
  }

  function saveKey() {
    const key = apikeyInput.value.trim();
    if (!key.startsWith('sk-ant-')) {
      apikeyStatus.textContent = "That doesn't look right — Anthropic keys start with sk-ant-";
      apikeyStatus.className = 'apikey-status';
      return;
    }
    localStorage.setItem('habla_api_key', key);
    showKeySaved();
  }

  function clearKey() {
    localStorage.removeItem('habla_api_key');
    apikeyInput.value = '';
    apikeySection.classList.remove('saved');
    apikeyStatus.textContent = 'Stored in your browser only — never sent anywhere except the Anthropic API.';
    apikeyStatus.className = 'apikey-status';
  }

  function showKeySaved() {
    apikeySection.classList.add('saved');
    apikeyStatus.textContent = '✓ Key saved in localStorage — ready to use.';
    apikeyStatus.className = 'apikey-status ok';
  }

  function getKey() {
    return localStorage.getItem('habla_api_key') || apikeyInput.value.trim();
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      translate();
    }
  });

  async function translate() {
    const text = input.value.trim();
    if (!text) return;

    const apiKey = getKey();
    if (!apiKey) {
      showError('Please enter and save your Anthropic API key above first.');
      return;
    }

    // Reset UI
    submitBtn.disabled = true;
    loading.classList.add('visible');
    resultCard.classList.remove('visible');
    errorMsg.classList.remove('visible');

    const prompt = 'The user is learning Spain Spanish (Castilian, Spain). They want to say the following in English:\n\n"' + text + '"\n\nRespond ONLY with a valid JSON object — no markdown, no backticks, no explanation. Use this exact structure:\n\n{\n  "spanish": "the most natural, everyday Spain Spanish way to say this",\n  "note": "one short sentence about anything Spain-specific, tense used, or register (formal/informal) — keep it under 15 words",\n  "words": [\n    {\n      "spanish": "word as used in the sentence",\n      "type": "verb|noun|adjective|adverb|preposition|other",\n      "english": "translation of this word in context",\n      "infinitive": "if verb: the infinitive form, otherwise null"\n    }\n  ]\n}\n\nFor compound forms like \'voy a\', list each token separately. List words in the order they appear.';

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();

      if (!response.ok) {
        const msg = (data && data.error && data.error.message) ? data.error.message : ('API error ' + response.status);
        showError('API error: ' + msg);
        console.error(data);
        return;
      }

      const raw = data.content.map(function(b) { return b.text || ''; }).join('');
      const clean = raw.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      currentPhrase = parsed.spanish;
      renderResult(parsed);

    } catch (err) {
      showError('Something went wrong: ' + err.message);
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      loading.classList.remove('visible');
    }
  }

  function renderResult(data) {
    spanishPhrase.textContent = data.spanish;
    notesStrip.textContent = data.note || '';

    vocabTable.innerHTML = '';
    (data.words || []).forEach(function(w) {
      const tr = document.createElement('tr');

      const badgeMap = {
        verb: 'badge-verb',
        noun: 'badge-noun',
        adjective: 'badge-adj',
        adverb: 'badge-adv',
        preposition: 'badge-prep'
      };
      const badgeClass = badgeMap[w.type] || 'badge-other';

      const infinitiveLine = w.infinitive
        ? '<div class="infinitive-note">infinitive: ' + w.infinitive + '</div>'
        : '';

      tr.innerHTML =
        '<td class="td-spanish">' + w.spanish + '</td>' +
        '<td class="td-type"><span class="type-badge ' + badgeClass + '">' + w.type + '</span></td>' +
        '<td class="td-english">' + w.english + infinitiveLine + '</td>';

      vocabTable.appendChild(tr);
    });

    resultCard.classList.add('visible');
  }

  function speak() {
    if (!currentPhrase) return;
    window.speechSynthesis.cancel();

    const utt = new SpeechSynthesisUtterance(currentPhrase);
    utt.lang = 'es-ES';
    utt.rate = 0.88;

    const voices = window.speechSynthesis.getVoices();
    const esVoice = voices.find(function(v) { return v.lang === 'es-ES'; }) ||
                    voices.find(function(v) { return v.lang.startsWith('es'); });
    if (esVoice) utt.voice = esVoice;

    window.speechSynthesis.speak(utt);
  }

  // Load voices early (some browsers need this)
  window.speechSynthesis.getVoices();

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }
</script>
</body>
</html>
